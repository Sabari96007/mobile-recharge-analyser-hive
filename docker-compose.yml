version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL - Hive Metastore Database
  # ---------------------------------------------------------------------------
  hive-postgres:
    image: postgres:15
    container_name: hive-postgres
    hostname: hive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - hive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. Apache Hive - HiveServer2 with Embedded Metastore to PostgreSQL
  # ---------------------------------------------------------------------------
  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    hostname: hive-server
    restart: unless-stopped
    depends_on:
      hive-postgres:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
        -Dmetastore.try.direct.sql.ddl=false
      HIVE_WAREHOUSE_PATH: /opt/hive/data/warehouse
      HIVE_SCRATCH_DIR: /opt/hive/scratch
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./lib/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar:ro
      - ./data:/opt/hive/data/input:ro
      - ./hive:/opt/hive/scripts:ro
      - hive-warehouse:/opt/hive/data/warehouse
    networks:
      - hive-network

# -----------------------------------------------------------------------------
# Networks and Persistent Volumes
# -----------------------------------------------------------------------------
networks:
  hive-network:
    name: hive-network
    driver: bridge

volumes:
  postgres-data:
    name: hive-postgres-data
  hive-warehouse:
    name: hive-warehouse-data
